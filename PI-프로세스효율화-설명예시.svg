    <style>text{font-family:'Noto Sans KR','Noto Sans CJK KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif}.arrow{fill:none;stroke:#64748B;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}</style>
  </defs>
  <rect width="1920" height="1080" fill="#F8FAFC" />
  <text x="58" y="52" font-size="34" font-weight="900" fill="#0F172A">AS-IS → TO-BE 프로세스 효율화, 이렇게 작성합니다</text>
  <text x="60" y="83" font-size="18" font-weight="600" fill="#475569">쉬운 예시: 회의실 예약 · 시간은 설명을 위한 가정값이며 LT는 작업+대기시간입니다.</text>
