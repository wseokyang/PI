<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">AS-IS에서 TO-BE로 작성하는 방향 — 쉬운 회의실 예약 예시</title>
  <desc id="desc">회의실 예약의 수작업 문의와 대기 과정을 ECRSA로 제거, 결합, 재배열, 단순화, 자동화해 70분에서 5분으로 줄이는 예시와 PI 문서 작성 원칙.</desc>
